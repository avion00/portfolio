<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15181e"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 90) rotate(130) scale(520)">
      <stop stop-color="#1f6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- label -->
  <g transform="translate(80 110)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <circle cx="5" cy="-4" r="5" fill="#1f6bff"/>
    <text x="22" y="0" fill="#9ca3af" font-size="22" letter-spacing="4">PORTFOLIO — ABHISEK.SITE</text>
  </g>

  <!-- name -->
  <text x="78" y="270" fill="#f2f2f2" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="92" font-weight="600" letter-spacing="-2">Abhishek Chaudhary</text>

  <!-- tagline -->
  <text x="80" y="350" fill="#1f6bff" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="600" letter-spacing="-1">AI &amp; Full Stack Developer</text>

  <!-- subtitle -->
  <text x="80" y="430" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="30">Multi-Agent AI · Automation · ERP/CRM · SaaS · Mobile Apps</text>

  <!-- footer chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#9ca3af" letter-spacing="2">
    <text x="80" y="560">FOUNDER OF AUTOSTACKS</text>
    <text x="1120" y="560" text-anchor="end" fill="#5b6470">NEPAL · WORLDWIDE</text>
  </g>

  <rect x="0" y="624" width="1200" height="6" fill="#1f6bff"/>
</svg>
